name: Protected preview gate checks

on:
  push:
    branches: [development]
    paths:
      - 'src/pages/preview-login/**'
      - 'src/components/ui/TextField.astro'
      - 'server/preview/**'
      - 'scripts/build-preview.mjs'
      - 'scripts/preview-test-router.php'
      - 'scripts/test-preview-security.mjs'
      - 'tests/ui/preview-login.spec.ts'
      - 'package.json'
      - '.github/workflows/preview-security-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:preview
      - name: Lint PHP and test protected routes
        run: |
          if ! command -v php >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y php-cli; fi
          php -l dist-preview/_preview/bootstrap.php
          php -l dist-preview/_preview/gate.php
          php -l dist-preview/_preview/auth.php
          node scripts/test-preview-security.mjs
      - run: npm run build:kit
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test tests/ui/preview-login.spec.ts
