name: UI interaction polish smoke

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/components/**'
      - 'src/pages/contacts/**'
      - 'src/pages/policy/**'
      - 'tests/ui/interaction-polish.spec.ts'
      - '.github/workflows/interaction-polish-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masterskaya-ui-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build interactive form preview
        env:
          PUBLIC_FORM_DELIVERY_ENABLED: 'true'
          UI_KIT_BUILD: '1'
        run: npm run build:kit
      - run: npx playwright install chromium
      - run: npx playwright test tests/ui/interaction-polish.spec.ts --project=chromium
