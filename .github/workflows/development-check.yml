name: Development component checks

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: component-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.lock.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Bootstrap missing lockfile once
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- package-lock.json
            git commit -m 'Lock dependencies for reproducible development checks'
            # Fast-forward only: a concurrent development update makes this fail safely.
            git push origin HEAD:development
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  components:
    needs: lockfile
    if: always() && (needs.lockfile.result == 'success' || needs.lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.lockfile.outputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:kit
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:ui
      - name: Record dependency audit
        if: always()
        continue-on-error: true
        run: npm audit --json > npm-audit.json
      - name: Save checks and review artifacts (no deployment)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: components-${{ github.sha }}
          retention-days: 7
          path: |
            dist-kit/
            playwright-report/
            test-results/
            npm-audit.json
