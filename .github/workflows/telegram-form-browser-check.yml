name: Telegram form browser contract (development)

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/telegram-form-browser-check.yml'
      - 'src/components/forms/ConsultationForm.astro'
      - 'src/layouts/SiteLayout.astro'
      - 'public/api/submit.php'
      - 'tests/ui/telegram-form-delivery.spec.ts'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:kit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/ui/telegram-form-delivery.spec.ts --project=chromium
