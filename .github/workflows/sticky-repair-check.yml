name: Sticky header, controls and mobile repair QA

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/components/**'
      - 'src/layouts/SiteLayout.astro'
      - 'src/styles/**'
      - 'src/pages/contacts/**'
      - 'tests/ui/sticky-repair-controls.spec.ts'
      - '.github/workflows/sticky-repair-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sticky-repair-qa-${{ github.sha }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build site in UI preview mode without external submissions
        env:
          PUBLIC_FORM_DELIVERY_ENABLED: 'false'
          UI_KIT_BUILD: '1'
        run: npm run build:kit
      - run: npx playwright install chromium
      - name: Site and new interaction regressions
        run: npx playwright test tests/ui/sticky-repair-controls.spec.ts tests/ui/portfolio.spec.ts tests/ui/portfolio-mobile-checkbox.spec.ts tests/ui/portfolio-print-refinements.spec.ts tests/ui/contacts.spec.ts --project=chromium
      - name: Repair mobile table and carousel specific acceptance
        run: |
          npx playwright test tests/ui/services-mobile.spec.ts --project=chromium --grep 'Mobile repair: eleven compact expandable price categories'
