name: Temporary Chromium mobile service diagnostics

on:
  push:
    branches: [qa/mobile-chromium-20261119]

permissions:
  contents: read

jobs:
  mobile-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:kit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/ui/services-mobile.spec.ts --project=chromium --reporter=line
      - name: Preserve failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporary-chromium-mobile-evidence
          retention-days: 3
          path: |
            test-results/
            playwright-report/
