name: Portfolio categories and print slider visual checks

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/components/blocks/PortfolioCatalog.astro'
      - 'src/components/blocks/PrintFormats.astro'
      - 'src/components/blocks/ApplicationSection.astro'
      - 'src/pages/portfolio/**'
      - 'src/pages/services/**'
      - 'src/data/portfolio.ts'
      - 'src/styles/services-mobile.css'
      - 'tests/ui/portfolio-print-refinements.spec.ts'
      - '.github/workflows/portfolio-print-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-print-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build Astro UI kit without Telegram delivery
        env:
          PUBLIC_FORM_DELIVERY_ENABLED: 'false'
        run: npm run build:kit
      - run: npx playwright install chromium
      - name: Verify responsive interactions, Figma slider geometry and existing portfolio flows
        run: npx playwright test tests/ui/portfolio-print-refinements.spec.ts tests/ui/portfolio.spec.ts tests/ui/portfolio-mobile-checkbox.spec.ts --project=chromium
