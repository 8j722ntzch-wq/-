name: QA mobile menu and popup polish

on:
  push:
    branches: [qa/menu-modal-stability-20261119]

permissions:
  contents: read

jobs:
  menu-popup:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:kit
      - run: npx playwright install chromium firefox
      - run: npx playwright test tests/ui/menu-modal-stability.spec.ts tests/ui/ui-kit-refresh.spec.ts tests/ui/mobile-dialogs.spec.ts --project=chromium --project=firefox --reporter=list
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: menu-modal-stability
          retention-days: 5
          path: |
            test-results/
            playwright-report/
