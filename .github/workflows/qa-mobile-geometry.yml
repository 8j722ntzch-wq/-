name: Temporary crossbrowser geometry diagnostics
on:
  push:
    branches: [qa/mobile-figma-acceptance-20261119]
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:kit
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test tests/ui/mobile-geometry-qa.spec.ts --reporter=list
      - name: Store visual review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-figma-diagnostics
          retention-days: 5
          path: |
            test-results/
            playwright-report/
